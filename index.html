<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy · My Mac</title>
<style>
  :root {
    --menubar-h: 28px;
    --glass: rgba(246, 246, 248, .72); --glass-strong: rgba(250, 250, 252, .92);
    --win: #ffffff; --win-side: #f1f1f4; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.09);
    --sel: #0a63e0; --sel-soft: rgba(10, 99, 224, .14); --shadow: 0 22px 70px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.25);
    --term-bg: #1e1e1e; --term-fg: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass: rgba(40, 40, 44, .62); --glass-strong: rgba(36, 36, 40, .94);
      --win: #232326; --win-side: #2b2b2f; --text: #f2f2f4; --muted: #a1a1a6; --line: rgba(255,255,255,.1);
      --sel: #2f7bf6; --sel-soft: rgba(47, 123, 246, .25); --shadow: 0 22px 70px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.15);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; color: var(--text);
         background: #1b2a4a; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  img { -webkit-user-drag: none; }

  /* ---------- wallpaper: generated, not Apple's ---------- */
  .wallpaper { position: fixed; inset: 0; background:
      radial-gradient(1200px 700px at 15% 20%, #ff9a8b 0%, transparent 60%),
      radial-gradient(1000px 800px at 85% 15%, #6a82fb 0%, transparent 55%),
      radial-gradient(900px 700px at 70% 90%, #3bd1c4 0%, transparent 55%),
      radial-gradient(800px 600px at 10% 95%, #b06ab3 0%, transparent 60%),
      linear-gradient(160deg, #24325f, #10162e); }
  @media (prefers-color-scheme: dark) { .wallpaper { filter: brightness(.62) saturate(1.1); } }

  /* ---------- menu bar ---------- */
  .menubar { position: fixed; top: 0; left: 0; right: 0; height: var(--menubar-h); z-index: 9000;
             display: flex; align-items: center; gap: 2px; padding: 0 10px;
             background: var(--glass); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
             border-bottom: .5px solid var(--line); }
  .mb-item { padding: 2px 9px; border-radius: 5px; font-size: 13px; white-space: nowrap; }
  .mb-item:hover, .mb-item.open { background: rgba(127,127,127,.22); }
  .mb-logo { font-size: 15px; font-weight: 700; }
  .mb-app { font-weight: 700; }
  .mb-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .menu { position: fixed; top: calc(var(--menubar-h) + 2px); min-width: 230px; padding: 5px; z-index: 9500;
          background: var(--glass-strong); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
          border-radius: 9px; box-shadow: var(--shadow); display: none; }
  .menu.show { display: block; }
  .menu button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 4px 10px; border-radius: 5px; }
  .menu button:hover { background: var(--sel); color: #fff; }
  .menu hr { border: 0; border-top: .5px solid var(--line); margin: 5px 6px; }
  .menu kbd { font: inherit; opacity: .55; }

  /* ---------- "what I see" / "what the public sees" (the switch exists in the local copy only) ---------- */
  .view { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
  .view-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .view-seg { display: flex; padding: 2px; border-radius: 7px; background: rgba(127,127,127,.22); }
  .view-seg button { padding: 1px 10px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
  .view-seg button.on { background: var(--glass-strong); box-shadow: 0 1px 3px rgba(0,0,0,.25); font-weight: 600; }

  /* ---------- desktop icons ---------- */
  .desk-icons { position: fixed; top: calc(var(--menubar-h) + 14px); right: 18px; display: grid; gap: 14px; z-index: 1; }
  .desk-icon { width: 88px; display: grid; justify-items: center; gap: 3px; padding: 4px; border-radius: 6px; }
  .desk-icon img { width: 60px; height: 60px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .desk-icon span { color: #fff; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,.7); text-align: center; padding: 0 4px; border-radius: 4px; }
  .desk-icon.sel img { background: rgba(0,0,0,.18); border-radius: 6px; }
  .desk-icon.sel span { background: var(--sel); text-shadow: none; }

  /* ---------- dock ---------- */
  .dock-wrap { position: fixed; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; z-index: 8000; pointer-events: none; }
  .dock { pointer-events: auto; display: flex; align-items: flex-end; gap: 4px; padding: 5px 7px; height: 66px; max-width: calc(100vw - 16px);
          background: var(--glass); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
          border-radius: 18px; border: .5px solid rgba(255,255,255,.35); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .dock-item { position: relative; display: flex; flex-direction: column; align-items: center; }
  .dock-item img, .dock-item .tile { width: 52px; height: 52px; transition: width .12s, height .12s, margin .12s; display: block; }
  .dock-item .tip { position: absolute; bottom: calc(100% + 12px); white-space: nowrap; padding: 4px 10px; border-radius: 6px;
                    background: var(--glass-strong); box-shadow: 0 2px 12px rgba(0,0,0,.25); display: none; font-size: 13px; }
  .dock-item:hover .tip { display: block; }
  .dock-item .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text); opacity: 0; margin-top: 2px; }
  .dock-item.running .dot { opacity: .8; }
  .dock-item.bounce img { animation: bounce .7s ease 1; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-22px); } 60% { transform: translateY(0); } 78% { transform: translateY(-8px); } }
  .dock-sep { width: 1px; align-self: stretch; margin: 6px 3px; background: rgba(127,127,127,.4); }

  /* ---------- windows ---------- */
  .win { position: fixed; display: flex; flex-direction: column; background: var(--win); border-radius: 11px; box-shadow: var(--shadow);
         overflow: hidden; resize: both; min-width: 300px; min-height: 180px; max-width: 100vw; max-height: calc(100vh - var(--menubar-h)); }
  .win.inactive { box-shadow: 0 12px 40px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.2); }
  .win.opening { animation: open .18s ease-out; }
  @keyframes open { from { transform: scale(.94); opacity: 0; } }
  .titlebar { flex: none; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: .5px solid var(--line);
              background: var(--win-side); }
  .win.terminal .titlebar { background: #2d2d2d; color: #ccc; border-color: #000; }
  .lights { display: flex; gap: 8px; }
  .lights button { width: 12px; height: 12px; border-radius: 50%; border: .5px solid rgba(0,0,0,.18); }
  .lights .c { background: #ff5f57; } .lights .m { background: #febc2e; } .lights .z { background: #28c840; }
  .win.inactive .lights button { background: #c8c8cc; }
  .titlebar .title { flex: 1; text-align: center; font-weight: 600; margin-right: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-body { flex: 1; min-height: 0; overflow: auto; }

  /* finder */
  .finder { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
  .f-side { background: var(--win-side); padding: 8px 8px 16px; overflow: auto; border-right: .5px solid var(--line); }
  .f-side h5 { margin: 12px 8px 3px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .f-side button { display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 8px; border-radius: 6px; text-align: left; }
  .f-side button img { width: 16px; height: 16px; }
  .f-side button.on { background: rgba(127,127,127,.22); }
  .f-side .n { margin-left: auto; color: var(--muted); font-size: 11px; }
  .f-main { display: flex; flex-direction: column; min-height: 0; }
  .f-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: .5px solid var(--line); }
  .f-bar b { font-size: 14px; }
  .f-bar input { margin-left: auto; width: 170px; padding: 4px 9px; border-radius: 6px; border: .5px solid var(--line); background: var(--win-side); color: var(--text); font: inherit; }
  .f-grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); align-content: start; gap: 6px; padding: 14px; }
  .f-item { display: grid; justify-items: center; gap: 4px; padding: 6px 4px; border-radius: 8px; text-align: center; }
  .f-item img, .f-item .tile { width: 56px; height: 56px; }
  .f-item span { font-size: 12px; line-height: 1.25; padding: 1px 4px; border-radius: 4px; word-break: break-word; }
  .f-item.sel { background: var(--sel-soft); }
  .f-item.sel span { background: var(--sel); color: #fff; }
  .f-item.gone { opacity: .5; }
  .f-item.hid { position: relative; }
  .f-item.hid::after { content: "\1F512"; position: absolute; top: 2px; left: calc(50% + 16px); font-size: 13px; }
  .f-status { flex: none; padding: 5px 12px; border-top: .5px solid var(--line); color: var(--muted); font-size: 11px; text-align: center; }
  .tile { display: grid; place-items: center; border-radius: 22%; color: #fff; font-weight: 700; }
  .tile.cli { background: linear-gradient(#3a3a3c, #1c1c1e); font-family: ui-monospace, Menlo, monospace; color: #3ee05f; font-size: 15px; border-radius: 14%; }

  /* info */
  .info { padding: 18px 20px 24px; }
  .info-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .info-head img, .info-head .tile { width: 72px; height: 72px; flex: none; font-size: 26px; }
  .info-head h2 { margin: 0; font-size: 20px; }
  .info-head p { margin: 2px 0 0; color: var(--muted); }
  .info .desc { margin: 0 0 12px; }
  .info dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0 0 14px; }
  .info dt { color: var(--muted); text-align: right; }
  .info dd { margin: 0; word-break: break-word; }
  .info dd small { color: var(--muted); }
  .info h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .hist { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: .5px solid var(--line); }
  .hist i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hist span:last-child { margin-left: auto; color: var(--muted); }
  .link { color: var(--sel); text-decoration: none; cursor: pointer; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: rgba(40,200,64,.16); color: #1f9d3a; }
  .pill.no { background: rgba(255,59,48,.14); color: #d70015; }

  /* about this mac */
  .about { padding: 26px 30px; text-align: center; }
  .about .laptop { font-size: 64px; line-height: 1; margin-bottom: 8px; }
  .about h2 { margin: 0; font-size: 24px; }
  .about .os { color: var(--muted); margin-bottom: 16px; }
  .about dl { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; text-align: left; margin: 0 auto; max-width: 300px; }
  .about dt { text-align: right; color: var(--muted); }
  .about dd { margin: 0; font-weight: 500; }

  /* terminal */
  .term { background: var(--term-bg); color: var(--term-fg); font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
          padding: 8px 10px; height: 100%; overflow: auto; user-select: text; -webkit-user-select: text; cursor: text; white-space: pre-wrap; word-break: break-word; }
  .term .p { color: #5fd7ff; } .term .ok { color: #87d787; } .term .dim { color: #8a8a8a; } .term .err { color: #ff8787; } .term .hl { color: #ffd75f; }
  .term-line { display: flex; }
  .term-line input { flex: 1; background: none; border: 0; outline: 0; color: inherit; font: inherit; padding: 0; caret-color: #e6e6e6; }

  /* spotlight */
  .spot-bg { position: fixed; inset: 0; z-index: 9800; display: none; }
  .spot-bg.show { display: block; }
  .spot { position: absolute; top: 18vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 32px));
          background: var(--glass-strong); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .spot input { width: 100%; font-size: 22px; padding: 14px 18px 14px 50px; border: 0; outline: 0; background: transparent; color: var(--text);
                background-image: radial-gradient(circle at 26px 50%, transparent 7px, var(--muted) 7.5px, var(--muted) 9px, transparent 9.5px); }
  .spot ul { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 50vh; overflow: auto; border-top: .5px solid var(--line); }
  .spot ul:empty { display: none; }
  .spot li { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; }
  .spot li img, .spot li .tile { width: 28px; height: 28px; font-size: 11px; }
  .spot li small { margin-left: auto; color: var(--muted); }
  .spot li.on { background: var(--sel); color: #fff; }
  .spot li.on small { color: rgba(255,255,255,.8); }
  .spot .head { padding: 8px 10px 2px; font-size: 11px; color: var(--muted); font-weight: 600; }

  /* launchpad */
  .launchpad { position: fixed; inset: 0; z-index: 8500; display: none; padding: 60px 8vw 120px; overflow: auto;
               background: rgba(20, 24, 40, .45); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
  .launchpad.show { display: block; animation: lp .2s ease-out; }
  @keyframes lp { from { opacity: 0; transform: scale(1.06); } }
  .launchpad input { display: block; margin: 0 auto 36px; width: 240px; padding: 6px 12px; border-radius: 8px; border: .5px solid rgba(255,255,255,.3);
                     background: rgba(255,255,255,.15); color: #fff; font: inherit; text-align: center; outline: 0; }
  .lp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 28px 12px; }
  .lp-grid button { display: grid; justify-items: center; gap: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 12px; }
  .lp-grid img { width: 76px; height: 76px; }

  .ctx { position: fixed; z-index: 9600; }

  @media (max-width: 700px) {
    .desk-icons { display: none; }
    .mb-menus, .view-count { display: none; }
    .dock { overflow-x: auto; justify-content: flex-start; }
    .dock-item img, .dock-item .tile { width: 42px !important; height: 42px !important; margin: 0 !important; }
    .finder { grid-template-columns: 1fr; }
    .f-side { display: none; }
  }
</style>
</head>
<body>
<div class="wallpaper"></div>

<div class="menubar">
  <button class="mb-item mb-logo" data-menu="system" title="Legacy">◆</button>
  <button class="mb-item mb-app" id="activeApp">Finder</button>
  <span class="mb-menus">
    <button class="mb-item" data-menu="file">File</button>
    <button class="mb-item" data-menu="go">Go</button>
    <button class="mb-item" data-menu="window">Window</button>
    <button class="mb-item" data-menu="help">Help</button>
  </span>
  <div class="mb-right">
    <span class="view" id="view"></span>
    <button class="mb-item" id="spotBtn" title="Spotlight (⌘K)">⌕</button>
    <span class="mb-item" id="clock"></span>
  </div>
</div>

<div class="menu" id="menu-system">
  <button data-act="about">About This Mac</button><hr>
  <button data-act="spotlight">Spotlight… <kbd>⌘K</kbd></button>
  <button data-act="launchpad">Launchpad</button><hr>
  <button data-act="closeAll">Close All Windows</button>
</div>
<div class="menu" id="menu-file">
  <button data-act="finder">New Finder Window</button>
  <button data-act="terminal">New Terminal Window</button><hr>
  <button data-act="closeTop">Close Window <kbd>⌘W</kbd></button>
</div>
<div class="menu" id="menu-go">
  <button data-act="go:apps">Applications</button>
  <button data-act="go:brew">Homebrew</button>
  <button data-act="go:recent">Recent Changes</button>
  <button data-act="go:trash">Trash</button>
</div>
<div class="menu" id="menu-window"></div>
<div class="menu" id="menu-help">
  <button data-act="help">About this page</button>
</div>

<div class="desk-icons" id="deskIcons"></div>
<div id="windows"></div>
<div class="dock-wrap"><div class="dock" id="dock"></div></div>

<div class="launchpad" id="launchpad"><input id="lpSearch" placeholder="Search" autocomplete="off"><div class="lp-grid" id="lpGrid"></div></div>
<div class="spot-bg" id="spotBg"><div class="spot"><input id="spotInput" placeholder="Spotlight Search" autocomplete="off"><ul id="spotList"></ul></div></div>

<script src="data.js"></script>
<script type="module">
// Where the data comes from, by copy of this page:
//   desktop-a    data.js holds both views (full and public); the menu bar switches between them
//   public-site  data.js holds the public view only: hidden items are removed at export
//   site         data.js names a legacy.db, and the full view is built from it here in the browser
const FULL = window.LEGACY ?? await loadFromDb(window.LEGACY_DB), PUB = window.LEGACY_PUBLIC;

// The same queries as poc/export.py, run in the browser by sql.js. extras.json carries what the
// database doesn't hold: icons, the Dock, categories, Homebrew descriptions, Finder dates, Mac model.
async function loadFromDb(url) {
  const dir = "vendor/sqljs/";
  await new Promise((ok, fail) => document.head.append(
    Object.assign(document.createElement("script"), { src: dir + "sql-wasm.js", onload: ok, onerror: fail })));
  const [SQL, buf, extra] = await Promise.all([
    initSqlJs({ locateFile: f => dir + f }),
    fetch(url).then(r => r.arrayBuffer()),
    fetch("extras.json").then(r => r.json()),
  ]);
  const db = new SQL.Database(new Uint8Array(buf));
  const rows = sql => { const st = db.prepare(sql), out = []; while (st.step()) out.push(st.getAsObject()); st.free(); return out; };
  const LABEL = { application: "App", "homebrew-cellar": "Homebrew", "homebrew-cask": "Cask", cargo: "Cargo", "npm-global": "npm", "mac-app-store": "App Store" };
  const MACOS = { 26: "Tahoe", 15: "Sequoia", 14: "Sonoma", 13: "Ventura", 12: "Monterey" };
  const change = r => { const v = JSON.parse(r.changes).version || [null, null]; return { type: r.event_type, at: r.occurred_at, from: v[0], to: v[1] }; };

  const history = new Map();
  for (const r of rows("SELECT tool_id, event_type, occurred_at, changes FROM change_events WHERE tool_id IS NOT NULL ORDER BY id DESC"))
    history.set(r.tool_id, [...(history.get(r.tool_id) || []), change(r)]);

  const tools = rows(`SELECT t.id, t.name, s.name AS source, t.status, t.installed_at, t.first_seen_at, t.attributes, t.identifier
                      FROM tools t JOIN sources s ON s.id = t.source_id`).map(r => {
    const a = JSON.parse(r.attributes || "{}"), source = LABEL[r.source] || r.source;
    const x = (source === "App" ? extra.apps[a.path] : extra.brew[r.name]) || {};
    const [date, dateKind] = r.installed_at ? [r.installed_at, "exact"] : x.dateAdded ? [x.dateAdded, "estimated"] : [r.first_seen_at, "first_seen"];
    return { id: r.id, name: r.name, source, version: a.version, date, dateKind, removed: r.status === "uninstalled", path: a.path,
      firstSeen: r.first_seen_at, history: history.get(r.id) || [], bundleId: source === "App" ? r.identifier : null, ...x };
  }).sort((a, b) => b.date.localeCompare(a.date));

  const events = rows(`SELECT e.id, e.tool_id, e.event_type, t.name, e.occurred_at, e.changes
                       FROM change_events e JOIN tools t ON t.id = e.tool_id ORDER BY e.id DESC LIMIT 50`)
    .map(r => ({ id: r.id, toolId: r.tool_id, name: r.name, ...change(r) }));

  const hw = JSON.parse(rows("SELECT attributes FROM local_identity LIMIT 1")[0]?.attributes || "{}");
  const byPath = new Map(tools.map(t => [t.path, t]));
  db.close();
  return { tools, events, systemIcons: extra.systemIcons,
    dock: extra.dock.map(d => ({ ...d, toolId: byPath.get(d.path)?.id ?? null })),
    mac: { model: extra.model, chip: hw.chip, memory: hw.memory,
      macos: hw.os_version ? `macOS ${MACOS[hw.os_version.split(".")[0]] || ""} ${hw.os_version}`.replace("  ", " ") : "" } };
}

const isPublic = FULL.view === "public" || (!!PUB && new URLSearchParams(location.search).get("view") === "public");
const D = isPublic && PUB ? PUB : FULL;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const src = rel => (window.LEGACY_ASSETS ?? "../data/") + rel;
const toDate = s => new Date(s.replace(" ", "T") + "Z");
const fmt = (s, o) => toDate(s).toLocaleString(undefined, o);
const LONG = { day: "numeric", month: "long", year: "numeric" };
const DT = { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };

const tools = D.tools;
const byId = new Map(tools.map(t => [t.id, t]));
const apps = tools.filter(t => t.source === "App" && !t.removed).sort((a, b) => a.name.localeCompare(b.name));
const brew = tools.filter(t => t.source === "Homebrew" && !t.removed).sort((a, b) => a.name.localeCompare(b.name));
const trash = tools.filter(t => t.removed);
const SYS = D.systemIcons;
const host = (D.mac.model || "mac").toLowerCase().replace(/\s+/g, "-");

// ---------- icons ----------
function iconHTML(t, cls = "") {
  if (t.icon) return `<img class="${cls}" src="${src(t.icon)}" alt="">`;
  if (t.source === "Homebrew") return `<span class="tile cli ${cls}">&gt;_</span>`;
  let h = 0; for (const c of t.name) h = (h * 31 + c.charCodeAt(0)) % 360;

    .map(t => ({ name: t.name, kind: t.removed ? "Removed" : t.source === "Homebrew" ? "Homebrew" : (t.category || "Application"), t, run: () => openInfo(t) }));
  const hitA = ACTIONS.filter(a => score(a.name) < 9);
  spotItems = [...hitA, ...hitT]; spotSel = 0; paintSpot();
}
function paintSpot() {
  $("spotList").innerHTML = spotItems.length ? spotItems.map((it, i) => `<li class="${i === spotSel ? "on" : ""}" data-i="${i}">
    ${it.t ? iconHTML(it.t) : `<img src="${src(it.icon)}">`}<span>${esc(it.name)}</span><small>${esc(it.kind)}</small></li>`).join("")
    : `<li><span style="color:var(--muted)">No results</span></li>`;
}
$("spotInput").addEventListener("input", e => renderSpot(e.target.value));
$("spotInput").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { spotSel = Math.min(spotSel + 1, spotItems.length - 1); paintSpot(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { spotSel = Math.max(spotSel - 1, 0); paintSpot(); e.preventDefault(); }
  else if (e.key === "Enter" && spotItems[spotSel]) { const it = spotItems[spotSel]; closeSpotlight(); it.run(); }
  else if (e.key === "Escape") closeSpotlight();
});
$("spotList").addEventListener("click", e => { const li = e.target.closest("[data-i]"); if (li) { closeSpotlight(); spotItems[+li.dataset.i].run(); } });
$("spotBg").addEventListener("pointerdown", e => { if (e.target === $("spotBg")) closeSpotlight(); });
$("spotBtn").onclick = openSpotlight;

// ---------- menus ----------
let openMenu = null;
function closeMenus() { document.querySelectorAll(".menu.show").forEach(m => m.classList.remove("show")); document.querySelectorAll(".mb-item.open").forEach(m => m.classList.remove("open")); openMenu = null; }
document.querySelectorAll("[data-menu]").forEach(b => {
  const show = () => { closeMenus(); const m = $("menu-" + b.dataset.menu); m.style.left = b.getBoundingClientRect().left + "px"; m.classList.add("show"); b.classList.add("open"); openMenu = b; };
  b.addEventListener("click", e => { e.stopPropagation(); openMenu === b ? closeMenus() : show(); });
  b.addEventListener("mouseenter", () => { if (openMenu && openMenu !== b) show(); });
});
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act; closeMenus();
    if (act === "about") openAbout();
    else if (act === "spotlight") openSpotlight();
    else if (act === "launchpad") openLaunchpad();
    else if (act === "finder") openFinder();
    else if (act === "terminal") openTerminal();
    else if (act === "closeTop") activeId && closeWin(activeId);
    else if (act === "closeAll") [...wins.keys()].forEach(closeWin);
    else if (act.startsWith("go:")) { const f = [...wins.values()].find(w => w.goto); f ? (f.goto(act.slice(3)), focusWin([...wins].find(([, w]) => w === f)[0])) : openFinder(act.slice(3)); }
    else if (act.startsWith("focus:")) focusWin(act.slice(6));
    else if (act === "help") alert("A simulated desktop of this Mac, built by Legacy from what's really installed. Nothing here touches the real machine."
      + (isPublic ? "\n\nThis is the public view: only what the owner chose to show, with major versions only." : ""));
    return;
  }
  if (!e.target.closest(".menu")) closeMenus();
});

// ---------- view switch ----------
if (PUB) {
  $("view").innerHTML = `<span class="view-count">${PUB.tools.length} shown · ${FULL.tools.length - PUB.tools.length} hidden</span>
    <span class="view-seg"><button data-view="" class="${isPublic ? "" : "on"}">What I see</button><button data-view="public" class="${isPublic ? "on" : ""}">What the public sees</button></span>`;
  $("view").addEventListener("click", e => {
    const b = e.target.closest("[data-view]");
    if (b && (b.dataset.view === "public") !== isPublic) location.search = b.dataset.view ? "?view=public" : "";
  });
} else if (isPublic) {
  $("view").innerHTML = `<span class="view-count">Public view</span>`;
}

// ---------- keyboard + clock ----------
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("spotBg").classList.contains("show") ? closeSpotlight() : openSpotlight(); }
  else if (e.key === "Escape") { closeSpotlight(); $("launchpad").classList.remove("show"); closeMenus(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "w" && activeId) { e.preventDefault(); closeWin(activeId); }
});
function tick() { $("clock").textContent = new Date().toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); }
tick(); setInterval(tick, 15000);

renderDock();
openFinder();
</script>
</body>
</html>
